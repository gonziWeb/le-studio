<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex, nofollow">
<title>Le Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0b'/%3E%3Cpath d='M7 18v-4M11 22V10M15 25V7M19 21v-10M23 18v-4' stroke='%23ff5c9a' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --bg:#0b0b0b; --panel:#171717; --panel2:#222222; --line:#2c2c2c;
  --ink:#f2f2f2; --mute:#a3a3a3; --dim:#6b6b6b;
  --amber:#ff5c9a; --amber2:#ff9ec3; --rose:#ff7a45; --teal:#8ec5ff;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:22px 0 8px}
h1{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:34px;letter-spacing:-.03em;margin:0;line-height:1}
h1 span{color:var(--amber)}
.sub{color:var(--mute);font-size:13px;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-weight:500;font-size:14px;white-space:nowrap}
.chip.on{background:var(--amber);border-color:var(--amber);color:#26070f}
.chip.add{border-style:dashed}
.status{color:var(--mute);text-align:center;padding:40px 10px}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty b{display:block;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:22px;color:var(--ink);margin-bottom:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;position:relative}
.card.playing{border-color:#6e2244;box-shadow:0 0 0 1px #6e2244 inset}
.top{display:flex;gap:12px;align-items:center}
.play{flex:none;width:48px;height:48px;border-radius:50%;background:var(--amber);color:#26070f;display:grid;place-items:center}
.play svg{width:20px;height:20px}
.meta{min-width:0;flex:1}
.title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{color:var(--mute);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{background:var(--panel2);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--amber2)}
.new{background:var(--rose);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
.note{color:#d4d4d4;font-size:14px;margin:10px 0 0;white-space:pre-wrap;word-wrap:break-word}
.wave{position:relative;margin-top:12px;height:56px;touch-action:none}
.wave canvas{width:100%;height:56px;display:block}
.marks{position:absolute;left:0;right:0;top:-4px;height:0}
.mark{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--teal);border:2px solid var(--panel)}
.times{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.foot{display:flex;gap:6px;margin-top:8px;align-items:center}
.foot button{color:var(--mute);font-size:13px;padding:6px 8px;border-radius:8px;display:flex;gap:6px;align-items:center}
.foot button:active{background:var(--panel2)}
.foot .sp{flex:1}
.comments{border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.cm{display:flex;gap:8px;padding:6px 0;align-items:flex-start}
.cm .who{font-weight:600;font-size:13px}
.cm .txt{font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.cm .when{color:var(--dim);font-size:12px}
.ts{flex:none;background:#1b2a3a;color:var(--teal);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.cm .x{margin-left:auto;color:var(--dim);font-size:12px;padding:2px 6px}
.cbox{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.cbox textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;max-height:120px}
.cbox .send{background:var(--amber);color:#26070f;border-radius:12px;padding:10px 14px;font-weight:600}
.atbtn{font-size:12px;color:var(--mute);padding:6px 0 0;display:flex;align-items:center;gap:6px}
.atbtn.on{color:var(--teal)}
.atbtn i{width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-style:normal;font-size:10px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--amber);color:#26070f;font-weight:600;padding:15px 24px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center;z-index:5;font-size:16px;white-space:nowrap}
.fab svg{width:18px;height:18px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheetbg.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;border-top:1px solid var(--line)}
.sheet h2{font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:22px;margin:0 0 14px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;font-weight:600;cursor:pointer}
.pick label small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:3px}
.pick label .ic{width:24px;height:24px;display:block;margin:0 auto 6px;color:var(--amber)}
.pick input{display:none}
.chosen{margin-top:12px;background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--amber2);display:none;word-break:break-all}
.field{margin-top:14px}
.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.field textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#26070f}
.btn:disabled{opacity:.45}
.prog{margin-top:14px;display:none}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar div{height:100%;background:var(--amber);width:0;transition:width .2s}
.prog p{color:var(--mute);font-size:13px;margin:6px 0 0}
.err{color:var(--rose);font-size:14px;margin-top:10px}
.hint{color:var(--dim);font-size:12px;margin-top:10px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:20;font-size:14px;display:none;max-width:90vw}
.dlg .row{margin-top:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.who-btn{color:var(--mute);font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);margin-bottom:2px;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gate{max-width:420px;margin:12vh auto 0;padding:0 20px;text-align:center}
.gate h1{margin-bottom:10px}
.gate p{color:var(--mute);margin:0 0 20px}
.gate input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;margin-bottom:12px;text-align:center}
.gate .btn{width:100%;margin-top:6px}
.gate form{text-align:left}
.glab{display:block;font-size:13px;color:var(--mute);margin:0 0 6px 2px}
.gate input{text-align:left}
.ulist{margin:0 0 6px}
.urow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow .n{flex:1;font-weight:600}
.urow .n small{color:var(--mute);font-weight:400;margin-left:6px}
.urow button{color:var(--mute);font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--mute);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--amber)}
.menu button.btn{width:100%;margin-top:10px}
.recbox{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;display:none}
.recdot{width:64px;height:64px;border-radius:50%;background:var(--amber);margin:0 auto 10px;display:grid;place-items:center;color:#fff}
.recdot.live{animation:pulse 1.2s infinite}
.recdot span{width:22px;height:22px;border-radius:5px;background:#fff;display:block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,92,154,.6)}70%{box-shadow:0 0 0 16px rgba(255,92,154,0)}100%{box-shadow:0 0 0 0 rgba(255,92,154,0)}}
.rectime{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.recbox audio{width:100%;margin-top:10px}
.level{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.level div{height:100%;width:0;background:var(--amber);transition:width .08s}
.player{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#121212;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px}
body.has-player .player{display:flex}
body.has-player .fab{bottom:calc(80px + env(safe-area-inset-bottom));left:auto;right:16px;transform:none;padding:14px;border-radius:50%}
body.has-player .fab span{display:none}
body.has-player .fab svg{width:22px;height:22px}
body.has-player{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.pbtn{flex:none;width:42px;height:42px;border-radius:50%;background:var(--amber);color:#26070f;display:grid;place-items:center}
.pbtn svg{width:18px;height:18px}
.pmeta{flex:1;min-width:0}
.ptitle{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptime{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.vol{flex:none;display:flex;align-items:center;gap:8px;color:var(--mute)}
.vol svg{width:20px;height:20px}
.vol input{width:110px;accent-color:var(--amber)}
@media (min-width:700px){.player{padding-left:calc(50% - 320px);padding-right:calc(50% - 320px)}.vol input{width:160px}}
.drop{position:fixed;inset:0;z-index:30;background:rgba(11,11,11,.85);display:none;align-items:center;justify-content:center;pointer-events:none}
.drop.on{display:flex}
.drop div{border:2px dashed var(--amber);color:var(--amber);border-radius:22px;padding:48px 40px;font-size:20px;font-weight:600;margin:24px;text-align:center}
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none">
  <h1>Le <span>Studio</span></h1>
  <p id="gateMsg"></p>
  <form id="gateForm">
    <label class="glab" for="gName">Prénom</label><input id="gName" type="text" autocomplete="username" autocapitalize="words">
    <label class="glab" for="gPw">Mot de passe</label><input id="gPw" type="password" autocomplete="current-password">
    <div id="gLegacyWrap" style="display:none"><label class="glab" for="gLegacy">Ancien mot de passe commun du studio</label><input id="gLegacy" type="password" autocomplete="off"></div>
    <button class="btn pri" id="gateGo" type="submit">Se connecter</button>
  </form>
  <div class="err" id="gateErr"></div>
</div>

<div id="app" style="display:none">
  <div class="wrap">
    <header>
      <h1>Le <span>Studio</span></h1>
      <button class="who-btn" id="whoBtn"></button>
    </header>
    <div class="chips" id="chips"></div>
    <div id="feed"><div class="status">Chargement…</div></div>
  </div>
  <button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter un morceau</span></button>
</div>

<!-- Upload sheet -->
<div class="sheetbg" id="upBg">
  <div class="sheet">
    <h2>Nouveau morceau</h2>
    <div class="pick">
      <label id="recBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Enregistrer</label>
      <label><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>Importer<input type="file" id="fileIn" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.ogg,.flac,.caf,.opus,.webm"></label>
    </div>
    <div class="recbox" id="recBox">
      <div class="recdot" id="recDot"><span></span></div>
      <div class="rectime" id="recTime">0:00</div>
      <div class="level" id="recLevel"><div></div></div>
      <audio id="recPrev" controls style="display:none"></audio>
      <div class="row" style="margin-top:12px"><button class="btn" id="recAgain" style="display:none">Recommencer</button><button class="btn pri" id="recStop">Arrêter</button></div>
    </div>
    <div class="chosen" id="chosen"></div>
    <div class="field"><label for="tTitle">Titre</label><input id="tTitle" maxlength="80"></div>
    <div class="field"><label for="tProj">Projet</label><select id="tProj"></select></div>
    <div class="field"><label for="tNote">Note</label><textarea id="tNote" maxlength="1000"></textarea></div>
    <div class="prog" id="prog"><div class="bar"><div id="barIn"></div></div><p id="progTxt"></p></div>
    <div class="err" id="upErr"></div>
    <div class="row"><button class="btn" id="upCancel">Annuler</button><button class="btn pri" id="upGo" disabled>Envoyer</button></div>
    <div class="hint" id="upHint"></div>
  </div>
</div>

<!-- Small dialog -->
<div class="sheetbg" id="dlgBg">
  <div class="sheet dlg">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div class="row"><button class="btn" id="dlgNo">Annuler</button><button class="btn pri" id="dlgYes">OK</button></div>
  </div>
</div>

<div class="player" id="player">
  <button class="pbtn" id="pPlay" aria-label="Lecture"></button>
  <div class="pmeta"><div class="ptitle" id="pTitle"></div><div class="ptime" id="pTime"></div></div>
  <div class="vol" id="volWrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume"></div>
</div>
<div class="drop" id="drop"><div>Dépose le fichier ici</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const ago = ms => {
  if (!ms) return "";
  const d = (Date.now() - ms) / 1000;
  if (d < 60) return "à l'instant";
  if (d < 3600) return "il y a " + Math.floor(d/60) + " min";
  if (d < 86400) return "il y a " + Math.floor(d/3600) + " h";
  if (d < 7*86400) { const n = Math.floor(d/86400); return n === 1 ? "hier" : "il y a " + n + " j"; }
  return new Date(ms).toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
};
function toast(msg){ const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(()=> t.style.display = "none", 3200); }
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

// ---------- API ----------
async function api(action, data, opts){
  opts = opts || {};
  const url = "api.php?a=" + action + (opts.query || "");
  let body;
  if (data) { body = new FormData(); for (const k in data) if (data[k] != null) body.append(k, data[k]); }
  const r = await fetch(url, { method: data ? "POST" : "GET", body, headers: { "X-Studio": "1" }, credentials: "same-origin" });
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok) { const e = new Error((j && j.error) || ("Erreur " + r.status)); e.status = r.status; throw e; }
  return j;
}
function uploadXhr(fd, onProgress){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open("POST", "api.php?a=upload"); x.setRequestHeader("X-Studio", "1");
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => { let j = null; try { j = JSON.parse(x.responseText); } catch(e){} if (x.status >= 200 && x.status < 300) res(j); else rej(new Error((j && j.error) || ("Erreur " + x.status + (x.status === 413 ? " : fichier trop gros pour le serveur" : "")))); };
    x.onerror = () => rej(new Error("Connexion perdue pendant l'envoi."));
    x.send(fd);
  });
}

// ---------- state ----------
let me = null;
let projects = [], tracks = [], comments = [], rev = -1, maxUpload = 0, loaded = false;
let filter = store.get("studio.filter") || "all";
const expanded = new Set();
const drafts = {}, atTime = {};
const lastSeen = Number(store.get("studio.lastSeen") || 0);
store.set("studio.lastSeen", String(Date.now()));

const audio = new Audio(); audio.preload = "metadata";
let curId = null;
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1"/><rect x="14" y="4" width="4.5" height="16" rx="1"/></svg>';

// ---------- boot / connexion ----------
let gateMode = null;
async function boot(){
  let st;
  try { st = await api("status"); } catch(e){ showGate("error", e.message); return; }
  maxUpload = st.maxUpload || 0;
  if (st.needsSetup) return showGate("setup", null, st.legacy);
  if (!st.user) return showGate("login");
  me = st.user; startApp();
}
function showGate(mode, msg, legacy){
  gateMode = mode; $("app").style.display = "none"; $("gate").style.display = "block"; $("gateErr").textContent = "";
  $("gPw").value = ""; $("gLegacy").value = "";
  $("gLegacyWrap").style.display = mode === "setup" && legacy ? "block" : "none";
  if (mode === "setup") { $("gateMsg").textContent = "Crée ton compte administrateur."; $("gPw").autocomplete = "new-password"; $("gateGo").textContent = "Créer le compte"; }
  else if (mode === "login") { $("gateMsg").textContent = ""; $("gPw").autocomplete = "current-password"; $("gateGo").textContent = "Se connecter"; }
  else { $("gateMsg").textContent = msg || "Le serveur ne répond pas."; $("gateForm").style.display = "none"; return; }
  $("gateForm").style.display = "block";
  setTimeout(() => ($("gName").value ? $("gPw") : $("gName")).focus(), 50);
}
$("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("gName").value.trim(), password = $("gPw").value;
  if (!name || !password) return;
  $("gateGo").disabled = true; $("gateErr").textContent = "";
  try {
    const r = gateMode === "setup"
      ? await api("setup", { name, password, legacy: $("gLegacyWrap").style.display === "block" ? $("gLegacy").value : null })
      : await api("login", { name, password });
    me = r.user; $("gateGo").disabled = false; startApp();
  } catch(err){ $("gateGo").disabled = false; $("gateErr").textContent = err.message; }
});

let started = false;
function startApp(){
  $("gate").style.display = "none"; $("app").style.display = "block";
  $("whoBtn").textContent = me.name;
  if (started) { rev = -1; refresh(); return; } started = true;
  refresh();
  setInterval(() => { if (!document.hidden && me) refresh(); }, 8000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && me) refresh(); });
}

// ---------- compte ----------

function drawWave(cv, peaks, prog){
  const dpr = window.devicePixelRatio || 1; const w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
  cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const n = Math.max(1, Math.floor(w / 4)); const bw = 2.4;
  for (let i = 0; i < n; i++) {
    const v = peaks.length ? peaks[Math.floor(i / n * peaks.length)] || 0 : 0.3;
    const bh = Math.max(2, v * (h - 4)); const x = i * (w / n);
    g.fillStyle = (i / n) < prog ? "#ff5c9a" : "#3a3a3a";
    g.beginPath(); if (g.roundRect) g.roundRect(x, (h - bh) / 2, bw, bh, 1.2); else g.rect(x, (h - bh)/2, bw, bh); g.fill();
  }
}

// ---------- recording ----------
let rec = null, recStream = null, recChunks = [], recStart = 0, recTimer = null, recCtx = null, recAnalyser = null;
function pickMime(){
  const c = ["audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
  if (!window.MediaRecorder) return null;
  return c.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch(e){ return false; } }) || "";
}
async function startRec(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || pickMime() === null) { $("upErr").textContent = "L'enregistrement n'est pas possible ici (il faut un site en https et un navigateur récent). Utilise « Importer »."; return; }
  stopRec(true); clearChosen();
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
  catch(e){ $("upErr").textContent = "Accès au micro refusé. Autorise le micro pour ce site dans les réglages du navigateur."; return; }
  const mime = pickMime();
  try { rec = mime ? new MediaRecorder(recStream, { mimeType: mime, audioBitsPerSecond: 192000 }) : new MediaRecorder(recStream); }
  catch(e){ rec = new MediaRecorder(recStream); }
  recChunks = [];
  rec.ondataavailable = e => e.data && e.data.size && recChunks.push(e.data);
  rec.onstop = onRecStop;
  rec.start(1000); recStart = Date.now();
  $("recBox").style.display = "block"; $("recDot").classList.add("live"); $("recDot").style.display = "grid"; $("recLevel").style.display = "block";
  $("recPrev").style.display = "none"; $("recAgain").style.display = "none"; $("recStop").style.display = "block"; $("recTime").textContent = "0:00";
  try { recCtx = new (window.AudioContext || window.webkitAudioContext)(); recAnalyser = recCtx.createAnalyser(); recAnalyser.fftSize = 512; recCtx.createMediaStreamSource(recStream).connect(recAnalyser); } catch(e){ recAnalyser = null; }
  const buf = new Uint8Array(512);
  recTimer = setInterval(() => {
    $("recTime").textContent = fmt((Date.now() - recStart) / 1000);
    if (recAnalyser) { recAnalyser.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); $("recLevel").firstChild.style.width = Math.min(100, m / 128 * 140) + "%"; }
  }, 100);
}
function stopRec(silent){
  clearInterval(recTimer); recTimer = null;
  if (rec && rec.state !== "inactive") { if (silent) rec.onstop = null; rec.stop(); }
  if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  if (recCtx) { recCtx.close().catch(()=>{}); recCtx = null; }
  $("recDot").classList.remove("live");
}
function onRecStop(){
  const type = (rec && rec.mimeType) || (recChunks[0] && recChunks[0].type) || "audio/webm";
  const ext = /mp4|aac/.test(type) ? "m4a" : /ogg/.test(type) ? "ogg" : "webm";
  const blob = new Blob(recChunks, { type: type.split(";")[0] });
  const d = new Date(); const name = "Enregistrement " + d.toLocaleDateString("fr-FR") + " " + d.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
  const file = new File([blob], "enregistrement." + ext, { type: blob.type });
  const p = $("recPrev"); p.src = URL.createObjectURL(blob); p.style.display = "block";
  $("recDot").style.display = "none"; $("recLevel").style.display = "none"; $("recStop").style.display = "none"; $("recAgain").style.display = "block";
  setChosen(file, name, false);
}

$("recStop").onclick = () => stopRec(false);
$("recAgain").onclick = startRec;

function setProg(p, txt){ $("prog").style.display = "block"; $("barIn").style.width = Math.round(p*100) + "%"; $("progTxt").textContent = txt; }
async function analyse(file){
  // durée + forme d'onde, calculées dans le navigateur (au mieux)
  if (file.size > 150 * 1048576) return { duration: 0, peaks: [] };
  const ab = await file.arrayBuffer();
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new Ctx(1, 1, 44100);
  const buf = await new Promise((res, rej) => { try { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); } catch(e){ rej(e); } });
  const bins = 200, out = new Array(bins).fill(0), chs = [];
  for (let c = 0; c < buf.numberOfChannels; c++) chs.push(buf.getChannelData(c));
  const len = buf.length, step = Math.max(1, Math.floor(len / bins / 64));
  for (let b = 0; b < bins; b++) { const s = Math.floor(b*len/bins), e = Math.floor((b+1)*len/bins); let m = 0; for (let i = s; i < e; i += step) for (const ch of chs) { const v = Math.abs(ch[i]); if (v > m) m = v; } out[b] = m; }
  const mx = Math.max(0.01, ...out);
  return { duration: buf.duration, peaks: out.map(v => Math.round(Math.pow(v / mx, 0.8) * 100) / 100) };
}
$("upGo").onclick = async () => {
  if (!chosenFile || busy) return;
  busy = true; $("upGo").disabled = true; $("upCancel").disabled = true; $("upErr").textContent = "";
  try {
    setProg(0.03, "Préparation…");
    let info = { duration: 0, peaks: [] };
    try { info = await analyse(chosenFile); } catch(e){ console.warn("analyse", e); }
    const fd = new FormData();
    fd.append("file", chosenFile, chosenFile.name);
    fd.append("title", $("tTitle").value.trim() || "Sans titre");
    fd.append("note", $("tNote").value.trim());
    fd.append("projectId", $("tProj").value);
    fd.append("duration", String(info.duration || 0));
    fd.append("peaks", JSON.stringify(info.peaks || []));
    await uploadXhr(fd, p => setProg(0.05 + p * 0.93, "Envoi… " + Math.round(p * 100) + " %"));
    setProg(1, "Envoyé !");
    busy = false; $("upCancel").disabled = false; closeUpload(); toast("Envoyé");
    await refresh();
  } catch(e){
    $("upErr").textContent = e.message; $("prog").style.display = "none";
    busy = false; $("upGo").disabled = false; $("upCancel").disabled = false;
  }
};

// ---------- glisser-déposer (ordinateur) ----------
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
const appOpen = () => $("app").style.display !== "none" && !busy;
window.addEventListener("dragenter", e => { if (!hasFiles(e) || !appOpen()) return; e.preventDefault(); dragDepth++; $("drop").classList.add("on"); });
window.addEventListener("dragover", e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = appOpen() ? "copy" : "none"; });
window.addEventListener("dragleave", e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("drop").classList.remove("on"); });
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $("drop").classList.remove("on");
  if (!appOpen()) return;
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  if (!/^(audio|video)\//.test(f.type) && !/\.(m4a|mp3|wav|aac|ogg|oga|opus|webm|flac|caf|mov|3gp|amr|mp4)$/i.test(f.name)) { toast("Ce fichier n'est pas un fichier audio."); return; }
  if (!$("upBg").classList.contains("open")) openUpload();
  stopRec(true); $("recBox").style.display = "none";
  setChosen(f, f.name.replace(/\.[^.]+$/, ""), true);
});

boot();
})();
</script>
